[package]
name = "ubiqx-nofap-desktop"
description = "Standalone desktop shell (Tauri 2) of the ubiqX nofap module: tray, the two IPC commands and the card window. Starts no productivity engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The binary carries the machine id, never the display name (see `ubiqx_core::nofap`).
[[bin]]
name = "ubiqx-shield"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
ubiqx-app.workspace = true
ubiqx-core.workspace = true
ubiqx-engine.workspace = true
ubiqx-nofap.workspace = true
# `main` hands `--shield-helper` runs to `ubiqx_platform::sysblock::helper` before Tauri starts.
ubiqx-platform.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
log = "0.4"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-log = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
