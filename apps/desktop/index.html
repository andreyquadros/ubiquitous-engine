<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/ubi/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ubiqX</title>
    <style>html { background: #060a14; } html:not(.dark) { background: #f3f5fa; }</style>
    <script>
      // Apply the persisted theme before the first paint to avoid a flash.
      (function () {
        try {
          var q = new URLSearchParams(window.location.search).get('theme');
          var stored = q || localStorage.getItem('ubiqx-theme');
          // Dark is the default instrument panel; only an explicit 'light' preference turns it off.
          if (stored !== 'light') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
