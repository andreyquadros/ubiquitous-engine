[package]
name = "ubiqx-platform"
description = "ubiqX platform adapters: macOS foreground window, idle, screenshots, browser URL, permissions, keychain; plus scripted mocks for other OSes and tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
ubiqx-core.workspace = true
async-trait.workspace = true
chrono.workspace = true
image.workspace = true
parking_lot.workspace = true
# No TLS backend on purpose: every binary that ships this crate also ships `ubiqx-ai`, whose
# `rustls-tls` feature is unified in, and a standalone `--target aarch64-apple-darwin` check
# of this crate then needs no C toolchain for the crypto backend.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
xcap = "0.9"
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
keyring = { version = "3.6", features = ["apple-native"] }

[dev-dependencies]
tempfile.workspace = true
tokio.workspace = true
