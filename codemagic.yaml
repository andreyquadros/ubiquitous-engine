# Codemagic: compila o ubiqX.app num Mac mini na nuvem, sem toolchain local.
# Conecte o repositório em https://codemagic.io (Add application → GitHub → este repo → codemagic.yaml),
# inicie o workflow "ubiqX macOS app" no branch desejado e baixe o .app (zipado) ou o .dmg em Artifacts.
# Passo a passo, quarentena e assinatura: docs/MACOS-TESTING.md § 3.1.
workflows:
  macos-app:
    name: ubiqX macOS app
    # mac_mini_m2 entra nos 500 minutos gratuitos por mês; mac_mini_m4 exige plano com cobrança.
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
      node: 22.18.0
      vars:
        CARGO_TERM_COLOR: always
        CARGO_INCREMENTAL: "0"
      # Assinatura opcional. Crie um grupo de variáveis chamado "ubiqx_apple" com
      #   APPLE_CERTIFICATE           (o .p12 em base64: `base64 -i ubiqx-dev.p12`)
      #   APPLE_CERTIFICATE_PASSWORD
      #   APPLE_SIGNING_IDENTITY      ("ubiqX Dev" ou "Developer ID Application: Nome (TEAMID)")
      # e, para notarizar com Developer ID, APPLE_ID, APPLE_PASSWORD e APPLE_TEAM_ID. Depois descomente:
      # groups:
      #   - ubiqx_apple
      # Sem o grupo o bundle sai com assinatura ad hoc ("-") e abre depois de remover a quarentena.
    cache:
      cache_paths:
        - $HOME/.cargo/registry
        - $HOME/.cargo/git
        - $CM_BUILD_DIR/target   # acelera muito; remova se o cache ficar pesado demais
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: "claude/*"
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Rust estável (rustup)
        script: |
          set -e
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable --no-modify-path
          source "$HOME/.cargo/env"
          cargo --version
      - name: pnpm 10 e dependências do frontend
        script: |
          set -e
          # Diagnóstico do que a máquina já traz (não interrompe a etapa).
          echo "arch: $(uname -m)"; node --version; npm --version
          echo "npm prefix: $(npm config get prefix 2>/dev/null || true)"
          echo "pnpm pré-instalado: $(command -v pnpm 2>/dev/null || echo nenhum) $(pnpm --version 2>/dev/null || true)"
          # Binário standalone do pnpm, com versão fixa: não passa pelo npm nem pelo /usr/local.
          PNPM_VERSION=10.34.5
          case "$(uname -m)" in arm64|aarch64) ASSET=pnpm-macos-arm64 ;; *) ASSET=pnpm-macos-x64 ;; esac
          mkdir -p "$HOME/.local/bin"
          curl -fsSL "https://github.com/pnpm/pnpm/releases/download/v${PNPM_VERSION}/${ASSET}" -o "$HOME/.local/bin/pnpm"
          chmod +x "$HOME/.local/bin/pnpm"
          export PATH="$HOME/.local/bin:$PATH"
          # A máquina do Codemagic tem um package.json acima do clone configurado para yarn; com a checagem
          # estrita ligada o pnpm 10 recusa rodar ("This project is configured to use yarn").
          export npm_config_package_manager_strict=false
          cd apps/desktop
          echo "pnpm em uso: $(command -v pnpm) $(pnpm --version)"
          pnpm install --frozen-lockfile
      - name: Compilar ubiqX.app
        script: |
          set -e
          source "$HOME/.cargo/env"
          export PATH="$HOME/.local/bin:$PATH"
          export npm_config_package_manager_strict=false
          cd apps/desktop
          export APPLE_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          pnpm tauri build --bundles app
      - name: Gerar DMG (opcional)
        ignore_failure: true
        script: |
          set -e
          source "$HOME/.cargo/env"
          export PATH="$HOME/.local/bin:$PATH"
          export npm_config_package_manager_strict=false
          cd apps/desktop
          export APPLE_SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:--}"
          pnpm tauri build --bundles dmg
    artifacts:
      - target/release/bundle/macos/*.app
      - target/release/bundle/dmg/*.dmg
