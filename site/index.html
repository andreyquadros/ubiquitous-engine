            "@type": "FAQPage",
            "@id": "%SITE_URL%#faq",
            "mainEntity": [
              {
                "@type": "Question",
                "name": "O que é o ubiqX?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "O ubiqX é um app de controle de tempo automático para macOS, Windows e Linux. Ele registra sozinho em que apps, janelas e sites você trabalha, usa IA para classificar cada bloco de tempo nas categorias que você criar e gera relatórios diários e mensais por categoria, prontos para entregar."
                }
              },
              {
                "@type": "Question",
                "name": "Preciso apertar play para ele contar o tempo?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Não. O ubiqX roda na barra de menus e registra a sua atividade continuamente, sozinho. Você não inicia nem para nada: no fim do dia o tempo já está medido e separado por categoria."
                }
              },
              {
                "@type": "Question",
                "name": "Em que o ubiqX é diferente do Rize, do RescueTime ou do Toggl?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Os dados ficam na sua máquina, sem conta e sem servidor do fornecedor. A classificação usa as categorias que você escreve, não uma taxonomia pronta. E a saída é um relatório por categoria pronto para entregar a um cliente ou instituição, não apenas um gráfico de produtividade."
                }
              },
              {
                "@type": "Question",
                "name": "O ubiqX substitui a planilha de horas?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Sim. O relatório diário chega com as atividades, os minutos e as evidências de cada categoria. Você revisa o que ficou em dúvida, corrige com uma tecla e exporta em Markdown."
                }
              },
              {
                "@type": "Question",
                "name": "O que sai do meu computador?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Apenas o necessário para classificar um bloco: nome do app, título da janela e domínio do site, com e-mails, telefones, CPF e CNPJ mascarados e sem a URL completa. Em blocos ambíguos, e só com a sua permissão, um print reduzido da janela ativa. Sem contas, sem telemetria e sem sincronização."
                }
              },
              {
                "@type": "Question",
                "name": "O ubiqX funciona sem internet?",
                "acceptedAnswer": {
                  "@type": "Answer",
                  "text": "Funciona. Sem conexão ele continua registrando e classifica pelas suas regras e pela memória das correções; os relatórios saem por template. Quando a conexão volta, a fila segue de onde parou."
                }
              }
            ]

    <script>

      (function () {
        try {
          var q = new URLSearchParams(window.location.search).get('lang');

          var l = String(stored).toLowerCase().indexOf('en') === 0 ? 'en' : 'pt-BR';
          document.documentElement.lang = l;
        } catch (e) {}
      })();
